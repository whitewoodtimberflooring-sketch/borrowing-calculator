<section class="calculator-box">

<h2>Stamp Duty Calculator</h2>

<div class="grid">

<div>
<label>Property Value ($)</label>
<input type="number" id="propertyPrice">
</div>

<div>
<label>State</label>
<select id="state">
<option value="vic">Victoria</option>
<option value="nsw">NSW</option>
<option value="qld">Queensland</option>
</select>
</div>

</div>

<button onclick="calculateStampDuty()">
Calculate Stamp Duty
</button>

<h3 id="stampResult">$0</h3>

</section>

<script>

function calculateStampDuty(){

let price = Number(document.getElementById('propertyPrice').value);
let state = document.getElementById('state').value;

let duty = 0;

if(state === 'vic'){
duty = price * 0.055;
}

if(state === 'nsw'){
duty = price * 0.052;
}

if(state === 'qld'){
duty = price * 0.045;
}

document.getElementById('stampResult').innerText =
'$' + Math.round(duty).toLocaleString();

}

</script>
