<!DOCTYPE html>
<html>
<head>
  <title>Repayment Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="font-family:sans-serif;max-width:400px;margin:40px auto;">

  <h2>Repayment Calculator</h2>

  <label>Loan Amount ($)</label><br>
  <input type="number" id="loan"><br><br>

  <label>Interest Rate (%)</label><br>
  <input type="number" id="rate" value="6"><br><br>

  <label>Loan Term (years)</label><br>
  <input type="number" id="years" value="30"><br><br>

  <button onclick="calculate()">Calculate Repayments</button>

  <h3 id="result"></h3>

<script>
function calculate() {
  let loan = parseFloat(document.getElementById('loan').value) || 0;
  let rate = (parseFloat(document.getElementById('rate').value) || 6) / 100;
  let years = parseFloat(document.getElementById('years').value) || 30;

  let monthlyRate = rate / 12;
  let n = years * 12;

  if (loan <= 0) {
    document.getElementById('result').innerText = "Enter loan amount";
    return;
  }

  // Mortgage repayment formula
  let repayment = loan * (monthlyRate * Math.pow(1 + monthlyRate, n)) /
                 (Math.pow(1 + monthlyRate, n) - 1);

  repayment = Math.round(repayment);

  document.getElementById('result').innerText =
    "Monthly Repayment: $" + repayment.toLocaleString();
}
</script>

</body>
</html>
