<section class="calculator-box">

<h2>Repayment Calculator</h2>

<div class="grid">

<div>
<label>Loan Amount ($)</label>
<input type="number" id="loanAmount">
</div>

<div>
<label>Interest Rate (%)</label>
<input type="number" id="interestRate" value="6">
</div>

<div>
<label>Loan Term (Years)</label>
<input type="number" id="loanTerm" value="30">
</div>

</div>

<button onclick="calculateRepayment()">
Calculate Repayments
</button>

<h3 id="repaymentResult">$0 / month</h3>

</section>

<script>

function calculateRepayment(){

let loan = Number(document.getElementById('loanAmount').value);
let rate = Number(document.getElementById('interestRate').value)/100/12;
let months = Number(document.getElementById('loanTerm').value)*12;

let repayment =
loan *
(rate * Math.pow(1+rate,months)) /
(Math.pow(1+rate,months)-1);

document.getElementById('repaymentResult').innerText =
'$' + Math.round(repayment).toLocaleString() + ' / month';

}

</script>
