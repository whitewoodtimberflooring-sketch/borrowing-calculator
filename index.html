<!DOCTYPE html>
<html>
<head>
  <title>Borrowing Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="font-family:sans-serif;max-width:500px;margin:40px auto;background:#f7f7f7;padding:25px;border-radius:12px;">

  <h2 style="margin-bottom:10px;">Smart Lending Group</h2>
  <p style="color:#555;margin-bottom:20px;">
    Use our calculator to estimate your borrowing power.
  </p>

  <h3>How Much Can I Borrow</h3>

  <label>Annual Income ($)</label><br>
  <input type="number" id="income" style="width:100%;margin-bottom:10px;"><br>

  <label>Monthly Expenses ($)</label><br>
  <input type="number" id="expenses" style="width:100%;margin-bottom:10px;"><br>

  <label>Other Monthly Debts ($)</label><br>
  <input type="number" id="debts" style="width:100%;margin-bottom:10px;"><br>

  <label>Interest Rate (%)</label><br>
  <input type="number" id="rate" value="6" style="width:100%;margin-bottom:10px;"><br>

  <label>Assessment Buffer (%)</label><br>
  <input type="number" id="buffer" value="3" style="width:100%;margin-bottom:10px;"><br>

  <label>Loan Term (years)</label><br>
  <input type="number" id="years" value="30" style="width:100%;margin-bottom:15px;"><br>

  <button onclick="calculateBorrow()" style="width:100%;padding:12px;background:#0078D4;color:white;border:none;border-radius:6px;">
    Calculate Borrowing Power
  </button>

  <h3 id="result" style="margin-top:20px;"></h3>

  <a href="https://smartlendinggroup.com.au" style="
    display:inline-block;margin-top:15px;padding:10px 20px;
    background:#0078D4;color:white;text-decoration:none;border-radius:6px;">
    Speak to a broker
  </a>

  <p style="margin-top:20px;font-size:14px;">
    This is an estimate only. For an accurate borrowing assessment,
    <strong>contact Smart Lending Group today.</strong>
  </p>

<script>
function calculateBorrow() {

  let income = parseFloat(document.getElementById('income').value) || 0;
  let expenses = parseFloat(document.getElementById('expenses').value) || 0;
  let debts = parseFloat(document.getElementById('debts').value) || 0;

  let rate = (parseFloat(document.getElementById('rate').value) || 6) / 100;
  let buffer = (parseFloat(document.getElementById('buffer').value) || 3) / 100;
  let years = parseFloat(document.getElementById('years').value) || 30;

  let testRate = rate + buffer;
  let monthlyRate = testRate / 12;

  let monthlyIncome = income / 12;
  let surplus = monthlyIncome - (expenses + debts);

  if (surplus <= 0) {
    document.getElementById('result').innerText =
      "Borrowing capacity: $0 (expenses too high)";
    return;
  }

  let n = years * 12;

  let borrowing = surplus * ((Math.pow(1 + monthlyRate, n) - 1) /
                   (monthlyRate * Math.pow(1 + monthlyRate, n)));

  borrowing = Math.round(borrowing * 0.9); // realism adjustment

  document.getElementById('result').innerText =
    "Estimated Borrowing Power: $" + borrowing.toLocaleString();
}
</script>

</body>
</html>
