<section class="calculator-box">

<h2>How Much Can I Borrow?</h2>

<div class="grid">

<div>
<label>Applicants</label>
<select id="applicants">
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

<div>
<label>Income Applicant 1 ($)</label>
<input type="number" id="income1">
</div>

<div>
<label>Income Applicant 2 ($)</label>
<input type="number" id="income2">
</div>

<div>
<label>Dependants</label>
<select id="dependants">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4+</option>
</select>
</div>

<div>
<label>Living Expenses Monthly ($)</label>
<input type="number" id="expenses">
</div>

<div>
<label>Credit Card Limits ($)</label>
<input type="number" id="creditCards">
</div>

<div>
<label>Car Loans Monthly ($)</label>
<input type="number" id="carLoans">
</div>

<div>
<label>Other Liabilities Monthly ($)</label>
<input type="number" id="otherLoans">
</div>

<div>
<label>Interest Rate (%)</label>
<input type="number" id="rate" value="6">
</div>

</div>

<button onclick="calculateBorrowing()">
Calculate
</button>

<h3 id="borrowResult">$0</h3>

</section>

<style>

.calculator-box{
max-width:900px;
margin:auto;
padding:40px;
background:white;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

input,select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
}

button{
width:100%;
margin-top:20px;
padding:16px;
background:#2f6fed;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

#borrowResult{
margin-top:30px;
font-size:40px;
text-align:center;
color:#2f6fed;
}

</style>

<script>

function calculateBorrowing(){

let income1 = Number(document.getElementById('income1').value)||0;
let income2 = Number(document.getElementById('income2').value)||0;
let dependants = Number(document.getElementById('dependants').value)||0;
let expenses = Number(document.getElementById('expenses').value)||0;
let creditCards = Number(document.getElementById('creditCards').value)||0;
let carLoans = Number(document.getElementById('carLoans').value)||0;
let otherLoans = Number(document.getElementById('otherLoans').value)||0;
let rate = Number(document.getElementById('rate').value)/100/12;

let totalIncome = (income1 + income2) * 0.70 / 12;

let dependantCost = dependants * 700;

let liabilities =
expenses +
dependantCost +
(creditCards * 0.03) +
carLoans +
otherLoans;

let available = totalIncome - liabilities;

let term = 30 * 12;

let borrowing =
available * ((1 - Math.pow(1 + rate, -term)) / rate);

borrowing = borrowing * 0.82;

document.getElementById('borrowResult').innerText =
'$' + Math.round(borrowing).toLocaleString();

}

</script>
